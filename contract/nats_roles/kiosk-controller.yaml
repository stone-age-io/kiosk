name: kiosk-controller
description: "The kiosk controller. Owns KIOSK_EVENTS and the KIOSK_CATALOG and KIOSK_STATE buckets, projects every node's ledger and sends commands to nodes. A bucket it only writes and reads gets the KV grants, not a durable consumer's."
publish_permissions:
  - "kiosk.*.cmd.>"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.*.KIOSK_EVENTS"
  - "$JS.API.STREAM.MSG.GET.KIOSK_EVENTS"
  - "$JS.API.CONSUMER.*.KIOSK_EVENTS"
  - "$JS.API.CONSUMER.*.KIOSK_EVENTS.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.KIOSK_EVENTS.>"
  - "$JS.API.CONSUMER.MSG.NEXT.KIOSK_EVENTS.>"
  - "$JS.API.DIRECT.GET.KIOSK_EVENTS.>"
  - "$JS.ACK.KIOSK_EVENTS.>"
  - "$JS.FC.KIOSK_EVENTS.>"
  - "$KV.KIOSK_CATALOG.>"
  - "$JS.API.STREAM.*.KV_KIOSK_CATALOG"
  - "$JS.API.CONSUMER.*.KV_KIOSK_CATALOG"
  - "$JS.API.CONSUMER.*.KV_KIOSK_CATALOG.>"
  - "$JS.API.DIRECT.GET.KV_KIOSK_CATALOG.>"
  - "$JS.FC.KV_KIOSK_CATALOG.>"
  - "$KV.KIOSK_STATE.>"
  - "$JS.API.STREAM.*.KV_KIOSK_STATE"
  - "$JS.API.CONSUMER.*.KV_KIOSK_STATE"
  - "$JS.API.CONSUMER.*.KV_KIOSK_STATE.>"
  - "$JS.API.DIRECT.GET.KV_KIOSK_STATE.>"
  - "$JS.FC.KV_KIOSK_STATE.>"
subscribe_permissions:
  - "kiosk.*.heartbeat"
  - "kiosk.*.sighting.raw"
  - "_INBOX.>"
  - "$SRV.>"
