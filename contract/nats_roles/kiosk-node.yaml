name: kiosk-node
description: "A kiosk node. Publishes its ledger events, heartbeat and sightings, answers the controller's commands, and reads the controller's buckets. It writes no bucket."
publish_permissions:
  - "kiosk.*.evt.>"
  - "kiosk.*.heartbeat"
  - "kiosk.*.sighting.raw"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.INFO.KV_catalog_items"
  - "$JS.API.CONSUMER.CREATE.KV_catalog_items"
  - "$JS.API.CONSUMER.CREATE.KV_catalog_items.>"
  - "$JS.API.CONSUMER.DELETE.KV_catalog_items.>"
  - "$JS.API.DIRECT.GET.KV_catalog_items.>"
  - "$JS.FC.KV_catalog_items.>"
  - "$JS.API.STREAM.INFO.KV_catalog_users"
  - "$JS.API.CONSUMER.CREATE.KV_catalog_users"
  - "$JS.API.CONSUMER.CREATE.KV_catalog_users.>"
  - "$JS.API.CONSUMER.DELETE.KV_catalog_users.>"
  - "$JS.API.DIRECT.GET.KV_catalog_users.>"
  - "$JS.FC.KV_catalog_users.>"
  - "$JS.API.STREAM.INFO.KV_catalog_groups"
  - "$JS.API.CONSUMER.CREATE.KV_catalog_groups"
  - "$JS.API.CONSUMER.CREATE.KV_catalog_groups.>"
  - "$JS.API.CONSUMER.DELETE.KV_catalog_groups.>"
  - "$JS.API.DIRECT.GET.KV_catalog_groups.>"
  - "$JS.FC.KV_catalog_groups.>"
  - "$JS.API.STREAM.INFO.KV_punch_state"
  - "$JS.API.CONSUMER.CREATE.KV_punch_state"
  - "$JS.API.CONSUMER.CREATE.KV_punch_state.>"
  - "$JS.API.CONSUMER.DELETE.KV_punch_state.>"
  - "$JS.API.DIRECT.GET.KV_punch_state.>"
  - "$JS.FC.KV_punch_state.>"
  - "$JS.API.STREAM.INFO.KV_open_checkouts_state"
  - "$JS.API.CONSUMER.CREATE.KV_open_checkouts_state"
  - "$JS.API.CONSUMER.CREATE.KV_open_checkouts_state.>"
  - "$JS.API.CONSUMER.DELETE.KV_open_checkouts_state.>"
  - "$JS.API.DIRECT.GET.KV_open_checkouts_state.>"
  - "$JS.FC.KV_open_checkouts_state.>"
  - "$JS.API.STREAM.INFO.KV_last_observed_state"
  - "$JS.API.CONSUMER.CREATE.KV_last_observed_state"
  - "$JS.API.CONSUMER.CREATE.KV_last_observed_state.>"
  - "$JS.API.CONSUMER.DELETE.KV_last_observed_state.>"
  - "$JS.API.DIRECT.GET.KV_last_observed_state.>"
  - "$JS.FC.KV_last_observed_state.>"
subscribe_permissions:
  - "kiosk.*.cmd.>"
  - "kiosk.*.sighting.raw"
  - "_INBOX.>"
  - "$SRV.>"
