name: kiosk-timeclock
description: "A timeclock terminal. Publishes punches and its heartbeat, and reads the KIOSK_CATALOG and KIOSK_STATE buckets."
publish_permissions:
  - "kiosk.*.evt.timeclock.punch"
  - "kiosk.*.heartbeat"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.INFO.KV_KIOSK_CATALOG"
  - "$JS.API.CONSUMER.CREATE.KV_KIOSK_CATALOG"
  - "$JS.API.CONSUMER.CREATE.KV_KIOSK_CATALOG.>"
  - "$JS.API.CONSUMER.DELETE.KV_KIOSK_CATALOG.>"
  - "$JS.API.DIRECT.GET.KV_KIOSK_CATALOG.>"
  - "$JS.FC.KV_KIOSK_CATALOG.>"
  - "$JS.API.STREAM.INFO.KV_KIOSK_STATE"
  - "$JS.API.CONSUMER.CREATE.KV_KIOSK_STATE"
  - "$JS.API.CONSUMER.CREATE.KV_KIOSK_STATE.>"
  - "$JS.API.CONSUMER.DELETE.KV_KIOSK_STATE.>"
  - "$JS.API.DIRECT.GET.KV_KIOSK_STATE.>"
  - "$JS.FC.KV_KIOSK_STATE.>"
subscribe_permissions:
  - "_INBOX.>"
  - "$SRV.>"
