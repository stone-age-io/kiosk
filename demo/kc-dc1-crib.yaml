# Northwind demo — the managed KC-DC1-CRIB node. DEMO TOOLING: do not copy to an install.
#
#   KIOSK_CONFIG=demo/kc-dc1-crib.yaml ./kiosk-app serve --dir pb_data_kc-dc1-crib
#
# Managed by the controller: the catalogue arrives over JetStream KV, and
# `kiosk-controller demo-seed --remote` installs this node's quantities and
# units over the command bus. The runbook in demo/rules/README.md has the
# order. Bound to 127.0.0.1 on purpose: /api/kiosk/* is anonymous, so the box
# is the trust boundary, and the rule-router driver must run on this host.

kiosk:
  code: "KC-DC1-CRIB"
  location_code: "KC-DC1"

server:
  port: 8101
  bind: "127.0.0.1"

session:
  idle_timeout: "5m"
  cart_grace_period: "30s"

returns:
  allow_cross_user: true
  allow_uncorrelated: true

nats:
  enabled: true
  url: "nats://localhost:4222"

controller:
  enabled: true

# Both interlocks off, so the driver's random punches land. Turn
# block_clock_out_with_open_checkouts on deliberately to show a worker with a
# tool out at one site being refused a clock-out at another.
timeclock:
  enabled: true
  require_clock_in_for_checkout: false
  block_clock_out_with_open_checkouts: false

# Two cabinets on the mock RFID reader: each reports the tags listed in its
# file under demo/tags. Delete a line, trigger a read, and the kiosk proposes
# the checkout (demo/rules/README.md, "The cabinet"). allow_mock is the opt-in
# a production config never sets.
rfid:
  enabled: true
  allow_mock: true
  read_window: "1s"
  readers:
    cabinet-a:
      mode: "enclosure_diff"
      enclosure_id: "A"
      tag_file: "demo/tags/kc-dc1-crib-a.txt"
    cabinet-b:
      mode: "enclosure_diff"
      enclosure_id: "B"
      tag_file: "demo/tags/kc-dc1-crib-b.txt"

branding:
  logo_path: "./branding/logo.svg"
  tagline: "Northwind Traders — Tool Crib"
